x-sandbox-build: &sandbox-build
  build:
    context: ./sandbox
    args:
      SANDBOX_UID: ${HERMES_UID:-1000}
      SANDBOX_GID: ${HERMES_GID:-1000}

services:
  model-downloader:
    profiles: [tools]
    build:
      context: ./model-downloader
    restart: "no"
    user: "${HERMES_UID:-1000}:${HERMES_GID:-1000}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      HOME: /tmp
      HF_HOME: /models/.cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./models:/models
    tmpfs:
      - /tmp:size=512m,mode=1777
    networks:
      - control-net

  sandbox-keygen:
    <<: *sandbox-build
    command: ["init-key"]
    restart: "no"
    read_only: true
    network_mode: none
    environment:
      HERMES_UID: ${HERMES_UID:-1000}
      HERMES_GID: ${HERMES_GID:-1000}
    volumes:
      - sandbox-client-key:/client-key
      - sandbox-authorized-key:/authorized-key
    tmpfs:
      - /tmp:size=64m,mode=1777

  sandbox:
    <<: *sandbox-build
    command: ["serve"]
    restart: unless-stopped
    depends_on:
      sandbox-keygen:
        condition: service_completed_successfully
    working_dir: /workspace
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - SYS_CHROOT
    cpus: ${SANDBOX_CPUS:-4.0}
    mem_limit: ${SANDBOX_MEMORY:-8g}
    pids_limit: ${SANDBOX_PIDS:-512}
    volumes:
      - ./workspace:/workspace
      - sandbox-home:/home/agent
      - sandbox-authorized-key:/run/hermes-authorized-key:ro
      - sandbox-host-keys:/etc/ssh/host-keys
    tmpfs:
      - /tmp:size=1g,mode=1777
      - /var/tmp:size=256m,mode=1777
      - /run:size=64m,mode=0755
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -s /home/agent/.ssh/authorized_keys
          && /usr/sbin/sshd -t -f /etc/ssh/sshd_config
          && pgrep -x sshd >/dev/null
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - sandbox-net

  sandbox-trust:
    <<: *sandbox-build
    command: ["trust-host"]
    restart: "no"
    depends_on:
      sandbox:
        condition: service_healthy
    user: "${HERMES_UID:-1000}:${HERMES_GID:-1000}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    network_mode: none
    volumes:
      - ./hermes-data/.ssh:/hermes-trust
      - sandbox-host-keys:/sandbox-host-key:ro
    tmpfs:
      - /tmp:size=64m,mode=1777

  ninfer:
    build:
      context: ./ninfer
      labels:
        org.opencontainers.image.source: https://github.com/Neroued/ninfer
        org.opencontainers.image.revision: feaf4dd0983fdaeb2ba4c06eec6da350e644fb3a
        org.opencontainers.image.base.name: docker.io/nvidia/cuda:13.1.2-runtime-ubuntu24.04
    command:
      - ninfer-serve
      - /models/${NINFER_MODEL_FILE:-qwen3_8_27b_nvfp4.ninfer}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --api-key
      - ${NINFER_API_KEY:?Run python stack.py setup to create .env}
      - --model-id
      - ${NINFER_MODEL_ID:-qwen-local}
      - --max-context
      - ${NINFER_CONTEXT_LENGTH:-131072}
      - --kv-capacity
      - auto
      - --max-concurrency
      - ${NINFER_MAX_CONCURRENCY:-2}
      - --prefill-chunk
      - "1024"
      - --kv-dtype
      - int8
      - --spec
      - mtp
      - --draft-tokens
      - "3"
      - --lm-head-draft
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${NINFER_GPU_DEVICE:-0}"]
              capabilities: [gpu]
    ports:
      - 127.0.0.1:${NINFER_HOST_PORT:-8080}:8080
    volumes:
      - ./models:/models:ro
    shm_size: 2gb
    stop_grace_period: 2m
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080;
          printf "GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3;
          IFS= read -r status <&3;
          [[ "$$status" == *" 200 "* ]]'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10m
    networks:
      - inference-net

  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:v2026.8.19@sha256:f3cba6abf5ed80d47a271498d663ace5dda87f45000552afb8be8370a35df1b5}
    command: ["gateway", "run"]
    restart: unless-stopped
    depends_on:
      ninfer:
        condition: service_healthy
      sandbox:
        condition: service_healthy
      sandbox-trust:
        condition: service_completed_successfully
    working_dir: /workspace
    cpus: ${HERMES_CPUS:-4.0}
    mem_limit: ${HERMES_MEMORY:-8g}
    pids_limit: ${HERMES_PIDS:-512}
    stop_grace_period: 1m
    environment:
      HERMES_UID: ${HERMES_UID:-1000}
      HERMES_GID: ${HERMES_GID:-1000}
      HERMES_WRITE_SAFE_ROOT: /opt/data:/workspace
      NINFER_API_KEY: ${NINFER_API_KEY:?Run python stack.py setup to create .env}
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 127.0.0.1
      API_SERVER_KEY: ${HERMES_API_SERVER_KEY:?Run python stack.py setup to create .env}
      HERMES_DASHBOARD: ${HERMES_DASHBOARD_ENABLED:-true}
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_USERNAME:?Run python stack.py setup to create .env}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_PASSWORD:?Run python stack.py setup to create .env}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_SECRET:?Run python stack.py setup to create .env}
    ports:
      - 127.0.0.1:${HERMES_DASHBOARD_HOST_PORT:-9119}:9119
    volumes:
      - ./hermes-data:/opt/data
      - ./workspace:/workspace:ro
      - sandbox-client-key:/ssh:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8642/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 2m
    networks:
      - inference-net
      - sandbox-net
      - control-net

networks:
  inference-net:
    driver: bridge
    internal: true
  sandbox-net:
    driver: bridge
    internal: true
  control-net:
    driver: bridge

volumes:
  sandbox-client-key:
  sandbox-authorized-key:
  sandbox-host-keys:
  sandbox-home:
