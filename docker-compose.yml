services:
  model-downloader:
    profiles: [tools]
    build:
      context: ./model-downloader
    init: true
    restart: "no"
    user: "${MODEL_DOWNLOAD_UID:-1000}:${MODEL_DOWNLOAD_GID:-1000}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      HOME: /tmp
      HF_HOME: /models/.cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./models:/models
    tmpfs:
      - /tmp:size=512m,mode=1777

  ninfer:
    build:
      context: ./ninfer
      labels:
        org.opencontainers.image.source: https://github.com/Neroued/ninfer
        org.opencontainers.image.revision: ad0f3d384b5cbcec4a48a3951c287b4e9831443e
        org.opencontainers.image.base.name: docker.io/nvidia/cuda:13.1.2-runtime-ubuntu24.04
    command:
      - ninfer-serve
      - /models/${NINFER_MODEL_FILE:-qwen3_8_27b_nvfp4.ninfer}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --api-key
      - ${NINFER_API_KEY:?Run python ninfer.py setup to create .env}
      - --model-id
      - ${NINFER_MODEL_ID:-qwen-local}
      - --max-context
      - ${NINFER_CONTEXT_LENGTH:-131072}
      - --kv-capacity
      - ${NINFER_KV_CAPACITY:-196608}
      - --max-concurrency
      - ${NINFER_MAX_CONCURRENCY:-2}
      - --pending-timeout-ms
      - ${NINFER_PENDING_TIMEOUT_MS:-120000}
      - --prefill-chunk
      - "1024"
      - --kv-dtype
      - ${NINFER_KV_DTYPE:-fp8}
      - --device-state-slots
      - ${NINFER_DEVICE_STATE_SLOTS:-2}
      - --host-state-slots
      - ${NINFER_HOST_STATE_SLOTS:-8}
      - --host-kv-mib
      - ${NINFER_HOST_KV_MIB:-8192}
      - --spec
      - mtp
      - --draft-tokens
      - "3"
      - --lm-head-draft
      - --preserve-thinking
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${NINFER_GPU_DEVICE:-0}"]
              capabilities: [gpu]
    ports:
      - "127.0.0.1:${NINFER_HOST_PORT:-8080}:8080"
    volumes:
      - ./models:/models:ro
    environment:
      HOME: /tmp
    tmpfs:
      - /tmp:size=256m,mode=1777
    shm_size: 2gb
    stop_grace_period: 2m
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080;
          printf "GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3;
          IFS= read -r status <&3;
          [[ "$$status" == *" 200 "* ]]'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10m
    networks:
      - inference-net

networks:
  inference-net:
    driver: bridge
