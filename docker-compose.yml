services:
  model-fetcher:
    profiles: [tools]
    build:
      context: ./model-builder
      dockerfile: fetcher/Dockerfile
    init: true
    restart: "no"
    user: "${MODEL_BUILD_UID:-1000}:${MODEL_BUILD_GID:-1000}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      HOME: /tmp
      HF_HOME: /work/.cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./model-build:/work
    tmpfs:
      - /tmp:size=512m,mode=1777

  model-converter:
    profiles: [tools]
    build:
      context: ./model-builder
      dockerfile: converter/Dockerfile
    init: true
    restart: "no"
    user: "${MODEL_BUILD_UID:-1000}:${MODEL_BUILD_GID:-1000}"
    read_only: true
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      HOME: /tmp
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${NINFER_GPU_DEVICE:-0}"]
              capabilities: [gpu]
    volumes:
      - ./model-build:/work:ro
      - ./models:/models
    tmpfs:
      - /tmp:size=4g,mode=1777
    shm_size: 2gb

  ninfer:
    build:
      context: ./ninfer
      labels:
        org.opencontainers.image.source: https://github.com/Neroued/ninfer
        org.opencontainers.image.revision: feaf4dd0983fdaeb2ba4c06eec6da350e644fb3a
        org.opencontainers.image.base.name: docker.io/nvidia/cuda:13.1.2-runtime-ubuntu24.04
    command:
      - ninfer-serve
      - /models/${NINFER_MODEL_FILE:-qwen3_8_27b_uncensored.ninfer}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --api-key
      - ${NINFER_API_KEY:?Run python ninfer.py setup to create .env}
      - --model-id
      - ${NINFER_MODEL_ID:-qwen-local}
      - --max-context
      - ${NINFER_CONTEXT_LENGTH:-131072}
      - --kv-capacity
      - ${NINFER_KV_CAPACITY:-131072}
      - --max-concurrency
      - ${NINFER_MAX_CONCURRENCY:-1}
      - --prefill-chunk
      - "1024"
      - --kv-dtype
      - int8
      - --spec
      - mtp
      - --draft-tokens
      - "3"
      - --lm-head-draft
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${NINFER_GPU_DEVICE:-0}"]
              capabilities: [gpu]
    ports:
      - "127.0.0.1:${NINFER_HOST_PORT:-8080}:8080"
    volumes:
      - ./models:/models:ro
    shm_size: 2gb
    stop_grace_period: 2m
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080;
          printf "GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3;
          IFS= read -r status <&3;
          [[ "$$status" == *" 200 "* ]]'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10m
    networks:
      - inference-net

networks:
  inference-net:
    driver: bridge
