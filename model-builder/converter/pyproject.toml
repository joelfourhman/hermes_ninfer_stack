[project]
name = "hermes-ninfer-model-converter"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.3.2",
    "safetensors==0.6.2",
    "torch==2.8.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
