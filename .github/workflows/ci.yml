name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Create CI-only environment
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          cp .env.example .env.ci
          ninfer_key="$(openssl rand -hex 32)"
          sed -i "s|^NINFER_API_KEY=.*|NINFER_API_KEY=${ninfer_key}|" .env.ci
          chmod 0600 .env.ci

      - name: Check generated and tracked text
        shell: bash
        run: git diff --check

      - name: Check Python syntax
        shell: bash
        run: python3 -m compileall -q ninfer.py stack scripts tests model-downloader/download_model.py

      - name: Lint Python and check generated documentation
        shell: bash
        run: |
          python3 -m pip install -r requirements-dev.txt
          python3 -m ruff check ninfer.py stack scripts tests model-downloader/download_model.py
          python3 ninfer.py docs --check

      - name: Run Python unit tests
        shell: bash
        run: python3 -m unittest discover -s tests -v

      - name: Smoke-test the public command surface
        shell: bash
        run: |
          python3 ninfer.py --help
          python3 ninfer.py prepare-model --help
          python3 ninfer.py select-model --help
          python3 ninfer.py install-hermes --help
          python3 ninfer.py use --help
          python3 ninfer.py configure-client --help
          python3 ninfer.py presets
          python3 ninfer.py profile --help
          python3 ninfer.py spec --help
          python3 ninfer.py job --help
          python3 ninfer.py bench-agent coding --smoke

      - name: Validate repository invariants
        shell: bash
        run: python3 ninfer.py validate

      - name: Validate Compose configuration
        shell: bash
        run: |
          docker compose --env-file .env.ci config --quiet
          docker compose --env-file .env.ci --profile tools config --quiet

      - name: Build one-shot model downloader
        shell: bash
        run: >-
          docker compose --env-file .env.ci
          --profile tools build model-downloader

  windows-host-helper:
    name: Test Python helper on Windows
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false
          fetch-depth: 1
          persist-credentials: false

      - name: Check Python syntax
        shell: cmd
        run: python -m compileall -q ninfer.py stack scripts tests model-downloader/download_model.py

      - name: Lint Python and check generated documentation
        shell: cmd
        run: |
          python -m pip install -r requirements-dev.txt
          python -m ruff check ninfer.py stack scripts tests model-downloader/download_model.py
          python ninfer.py docs --check

      - name: Run Python unit tests
        shell: cmd
        run: python -m unittest discover -s tests -v

      - name: Smoke-test the Python command surface
        shell: cmd
        run: |
          python ninfer.py --help
          python ninfer.py prepare-model --help
          python ninfer.py select-model --help
          python ninfer.py install-hermes --help
          python ninfer.py use --help
          python ninfer.py configure-client --help
          python ninfer.py presets
          python ninfer.py profile --help
          python ninfer.py spec --help
          python ninfer.py job --help
          python ninfer.py bench-agent coding --smoke
